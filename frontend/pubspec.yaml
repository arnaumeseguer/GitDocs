name: gitdocs
description: AI-powered README generator for GitHub repositories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  flutter_markdown: ^0.6.23
  go_router: ^14.8.1
  google_fonts: ^6.3.3
  http: ^1.6.0
  markdown: ^7.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
